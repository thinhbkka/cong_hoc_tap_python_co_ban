<!DOCTYPE html>
<html lang="vi">

<style>
    /* Remove "-" before automatically generated sidebar headings */
    .app-sub-sidebar li::before {
        content: none !important;
    }
</style>
<head>
    <meta charset="UTF-8">
    <title>Cổng Học Tập Python Cơ Bản</title>

    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

    <!-- Docsify Vue Theme -->
    <link rel="stylesheet"
          href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">

    <!-- Dark / Light Theme -->
    <link rel="stylesheet"
          href="//cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/dist/style.min.css"
          title="docsify-darklight-theme">
</head>

<body>
<div id="app">Đang tải Cổng Học Tập Python...</div>
<script>
    window.$docsify = {
        name: 'Cổng Học Tập Python Cơ Bản',

        repo: '',
        /* HomePage */
        homepage: 'trang-chu.md',
        loadSidebar: true,
        subMaxLevel: 3,
        search: 'auto',
        darklightTheme: {
            siteFont: 'Arial, sans-serif',
            defaultTheme: 'light',
            codeFontFamily: 'monospace',
            bodyFontSize: '15px'
        }
    };
</script>

<!-- Docsify -->
<script src="//cdn.jsdelivr.net/npm/docsify@4"></script>

<!-- Search -->
<script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>

<!-- Copy code -->
<script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>

<!-- Count words / reading time -->
<script src="//cdn.jsdelivr.net/npm/docsify-count/dist/countable.min.js"></script>

<!-- Dark / Light mode -->
<script src="//cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/dist/index.min.js"></script>

</body>
</html>
